<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rıfkı</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<style>
body{margin:0;background:#000;color:#fff;font-family:sans-serif}
video#v{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;display:none}
#i{position:fixed;inset:0;background:#111;z-index:5;text-align:center;padding:8% 16px 0;overflow:auto}
button,label{font-size:18px;padding:12px 22px;border-radius:14px;border:0;background:#0a84ff;color:#fff;display:inline-block;margin:6px}
button:disabled{background:#444}
select{width:90%;font-size:16px;margin:6px;padding:8px}
input[type=range]{width:70%}
#d{position:fixed;left:8px;bottom:6px;opacity:.5;z-index:9}
#cw{position:fixed;right:10px;top:10px;width:30vmin;height:30vmin;border-radius:14px;overflow:hidden;border:2px solid #0a84ff;z-index:8;display:none;background:#000}
#cw.gz{opacity:0;width:6px;height:6px;border:0;pointer-events:none}
#cv{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
#cs{position:absolute;left:0;right:0;bottom:0;background:#000a;font-size:12px;text-align:center;min-height:16px}
#atla{position:fixed;left:8px;top:8px;z-index:9;opacity:.35;font-size:13px;padding:6px 10px;display:none;background:#555}
</style></head><body>
<video id="v" loop muted playsinline></video>
<div id="cw"><video id="cv" autoplay playsinline muted></video><div id="cs"></div></div>
<button id="atla">Atla</button>
<div id="i">
<h2>Rıfkı</h2>
<p id="st">WiFi bekleniyor...</p>
<label>Video seç<input id="f" type="file" accept="video/*" hidden></label><br>
<button id="b" disabled>Başlat</button>
<hr>
<p>Ses ayarı</p>
<select id="sl"></select><br>
<button onclick="pre(1,1)">Normal</button><button onclick="pre(0.6,0.85)">Robot</button><button onclick="pre(1.7,1.1)">Tiz</button><button onclick="pre(0.8,0.7)">Yavaş</button><br>
Ton <input id="pt" type="range" min="0.4" max="2" step="0.1"><br>
Hız <input id="hz" type="range" min="0.5" max="1.6" step="0.1"><br>
<button onclick="dene()">Sesi dinle</button>
</div>
<div id="d"></div>
<script>
var AYNA=true;
var v=document.getElementById('v'),d=document.getElementById('d'),st=document.getElementById('st'),bt=document.getElementById('b'),sl=document.getElementById('sl'),pt=document.getElementById('pt'),hz=document.getElementById('hz'),cv=document.getElementById('cv'),cw=document.getElementById('cw'),cs=document.getElementById('cs'),atl=document.getElementById('atla');
var db,D=null,kon=0,basladi=0,mod='n',soru='',pen=0,mt=0,L=[],A={ses:'',pit:1,hiz:1},vs=[],rec=null,ks='',kisi='',son='',sj=-1,sid=0;
var W=/r[ıiu]+[fpv]\s?[kgq]/i,RW=/r[ıiu]+[fpv]\s?[kgq][ıi]?/g;
var cal=null,duyulan=0,tur=0;
var KEL=[{t:'rıfkı',re:W},{t:'merhaba',re:/mer\s?ha?ba|meraba/},{t:'televizyon',re:/tele\s?vizyo|televizy/}];
var akim=null,cvs=document.createElement('canvas'),cx,onc=null,yuzS=0,yuz=false,cdt=null,fd=null,fok=false,fbusy=false,fxr=-1;
var K={vis:false,px:0.5,stab:false},lastpx=0.5,hedef=null,hs=0,bad=0,visH=[],pxH=[];
cvs.width=64;cvs.height=48;cx=cvs.getContext('2d',{willReadFrequently:true});
try{fd=new FaceDetector({fastMode:true,maxDetectedFaces:1})}catch(e){fd=null}
try{D=JSON.parse(localStorage.getItem('rifki'))}catch(e){}
try{L=JSON.parse(localStorage.getItem('rifki_ogr'))||[]}catch(e){}
try{A=JSON.parse(localStorage.getItem('rifki_ses'))||A}catch(e){}
try{kisi=localStorage.getItem('rifki_kisi')||''}catch(e){}
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js')}
pt.value=A.pit;hz.value=A.hiz;

var SAKA=[
'Matematik kitabı neden üzgün? Çünkü çok problemi var.',
'Telefon neden doktora gitmiş? Ekranı çatlamış, kendini kırık hissediyormuş.',
'Robotlar neden hiç yorulmaz? Çünkü pilleri bitene kadar enerjileri tamdır.',
'Ağaç neden internete kolay girer? Çünkü zaten kökten bağlantısı var.',
'Saat neden hiç yalan söylemez? Çünkü her zaman vaktinde doğruyu tik taklar.',
'Bilgisayar neden hiç aç kalmaz? Çünkü içinde bir sürü bayt var.'
];

function ky(){try{localStorage.setItem('rifki_ses',JSON.stringify(A))}catch(e){}}
function og(){try{localStorage.setItem('rifki_ogr',JSON.stringify(L))}catch(e){}}
function ky2(){try{localStorage.setItem('rifki_kisi',kisi)}catch(e){}}
function ad(){return kisi?kisi+', ':''}
function cap(s){return s.charAt(0).toLocaleUpperCase('tr')+s.slice(1)}
function sesler(){try{vs=speechSynthesis.getVoices()}catch(e){return}
var t=vs.filter(function(x){return /^tr/i.test(x.lang)});if(!t.length)t=vs;
sl.innerHTML='';t.forEach(function(x){var o=document.createElement('option');o.value=x.name;o.textContent=x.name;if(x.name==A.ses)o.selected=true;sl.appendChild(o)});
if(!A.ses&&t[0])A.ses=t[0].name}
try{speechSynthesis.onvoiceschanged=sesler}catch(e){}
sesler();
sl.onchange=function(){A.ses=sl.value;ky();dene()};
pt.oninput=function(){A.pit=+pt.value;ky()};
hz.oninput=function(){A.hiz=+hz.value;ky()};
function pre(p,h){A.pit=p;A.hiz=h;pt.value=p;hz.value=h;ky();dene()}
function dene(){say('Merhaba, ben Rıfkı. Bu sesim nasıl?')}

function hazir(){bt.disabled=false}
function guncelle(){
var ac=new AbortController();setTimeout(function(){ac.abort()},6000);
fetch('data.json',{cache:'no-store',signal:ac.signal}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(j){
D=j;try{localStorage.setItem('rifki',JSON.stringify(j))}catch(e){}
st.textContent='Tamamlandı! Veriler indirildi. Şimdi RIFKI.İRA ağına bağlanın, sonra Başlat tuşuna basın.';hazir()
}).catch(function(){
if(D){st.textContent='İnternet yok, kayıtlı veriler kullanılıyor. Başlat tuşuna basabilirsiniz.';hazir()}
else{st.textContent='WiFi bekleniyor... İnternete bağlanın.';setTimeout(guncelle,4000)}
})}
guncelle();

var q=indexedDB.open('k',1);
q.onupgradeneeded=function(){q.result.createObjectStore('s')};
q.onsuccess=function(){db=q.result;try{var g=db.transaction('s').objectStore('s').get('v');g.onsuccess=function(){if(g.result)sh(g.result)}}catch(e){}};
function sh(b){v.src=URL.createObjectURL(b);v.style.display='block';try{v.play()}catch(e){}}
document.getElementById('f').onchange=function(e){var b=e.target.files[0];if(b){try{db.transaction('s','readwrite').objectStore('s').put(b,'v')}catch(x){}sh(b)}};

function say(m,cb){
var my=++sid,bitti=false;
son=m;ks=m;kon=1;
try{if(rec)rec.abort()}catch(e){}
var fin=function(){if(bitti||my!=sid)return;bitti=true;setTimeout(function(){if(my!=sid)return;kon=0;if(cb)cb()},600)};
try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(m);u.lang='tr-TR';u.pitch=A.pit;u.rate=A.hiz;
for(var i=0;i<vs.length;i++){if(vs[i].name==A.ses){u.voice=vs[i];break}}
u.onend=fin;u.onerror=fin;speechSynthesis.speak(u);
setTimeout(fin,m.length*110+4000)}catch(e){fin()}}

function nor(s){return s.toLocaleLowerCase('tr').replace(RW,' ').replace(/[^a-zçğıöşü0-9 ]/g,' ').replace(/\s+/g,' ').trim()}
function benz(a,b){if(!a||!b)return 0;var x=a.split(' '),y=b.split(' '),o=0;x.forEach(function(w){if(y.indexOf(w)>=0)o++});return o/Math.max(x.length,y.length)}
function dice(a,b){if(a.length<2||b.length<2)return a==b?1:0;var m={},i,c=0;for(i=0;i<a.length-1;i++){var g=a.substr(i,2);m[g]=(m[g]||0)+1}
for(i=0;i<b.length-1;i++){var h=b.substr(i,2);if(m[h]>0){m[h]--;c++}}return 2*c/(a.length+b.length-2)}
function var_(n,l){var t=n.split(' ');for(var i=0;i<l.length;i++){if(t.indexOf(l[i])>=0)return true}return false}
function sec(c){return Array.isArray(c)?c[Math.floor(Math.random()*c.length)]:c}
function md(x){mod=x;clearTimeout(mt);if(x!='n')mt=setTimeout(function(){mod='n'},40000)}

function hesap(h){
var s=h.toLocaleLowerCase('tr').replace(/(\d)\s*,\s*(\d)/g,'$1.$2').replace(/[×*]/g,' çarpı ').replace(/\+/g,' artı ').replace(/[−–]/g,' eksi ').replace(/[÷\/]/g,' bölü ').replace(/(\d)\s*-\s*(\d)/g,'$1 eksi $2');
var m=s.match(/(\d+(?:\.\d+)?)\s*(artı|eksi|çarpı|çarp|kere|kez|bölü|böl|x)\s*(\d+(?:\.\d+)?)/);
if(!m)return null;
var a=+m[1],b=+m[3],o=m[2],r;
if(o=='artı')r=a+b;
else if(o=='eksi')r=a-b;
else if(o=='bölü'||o=='böl'){if(b==0)return 'Sıfıra bölemem.';r=a/b}
else r=a*b;
r=Math.round(r*100)/100;
return 'Sonuç '+String(r).replace('.',',')}

/* ---------- KAMERA ---------- */
function konum(p){return p<0.36?'sol':(p>0.64?'sag':'orta')}
function kamAc(gizli){
if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)return Promise.reject(new Error('yok'));
return navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:320},height:{ideal:240}},audio:false}).then(function(s){
akim=s;cv.srcObject=s;cw.className=gizli?'gz':'';cw.style.display='block';
var p=cv.play();onc=null;yuzS=0;yuz=false;fok=false;fxr=-1;hedef=null;hs=0;bad=0;visH=[];pxH=[];lastpx=0.5;
clearInterval(cdt);cdt=setInterval(kamDon,200);
return p?p.catch(function(){}):0})}
function kamKapat(){clearInterval(cdt);cdt=null;if(akim){akim.getTracks().forEach(function(t){t.stop()});akim=null}cv.srcObject=null;cw.style.display='none';cw.className='';cs.textContent='';hedef=null;hs=0;visH=[];pxH=[]}
function kamDon(){
if(!akim||cv.readyState<2)return;
var im;try{cx.drawImage(cv,0,0,64,48);im=cx.getImageData(0,0,64,48).data}catch(e){return}
var N=3072,g=new Uint8Array(N),dif=0,sk=0,sx=0,x0=64,x1=0,y0=48,y1=0,p,i,r,gg,b,Y,Cb,Cr,xx,yy;
for(i=0;i<N;i++){p=i*4;r=im[p];gg=im[p+1];b=im[p+2];Y=0.299*r+0.587*gg+0.114*b;g[i]=Y;
if(onc&&Math.abs(Y-onc[i])>28)dif++;
Cb=128-0.1687*r-0.3313*gg+0.5*b;Cr=128+0.5*r-0.4187*gg-0.0813*b;
if(Y>50&&Cb>77&&Cb<127&&Cr>133&&Cr<173){sk++;xx=i%64;yy=(i/64)|0;sx+=xx;if(xx<x0)x0=xx;if(xx>x1)x1=xx;if(yy<y0)y0=yy;if(yy>y1)y1=yy}}
onc=g;
var ok=false;
if(sk>0){var bw=x1-x0+1,bh=y1-y0+1,fill=sk/(bw*bh),asp=bh/bw;ok=(sk/N>0.05&&sk/N<0.5&&fill>0.45&&asp>0.7&&asp<2.0&&bw>10)}
if(fd&&!fbusy){fbusy=true;fd.detect(cv).then(function(f){if(f.length){fok=true;var bb=f[0].boundingBox;fxr=(bb.x+bb.width/2)/(cv.videoWidth||320)}else{fok=false}fbusy=false}).catch(function(){fd=null;fbusy=false})}
var gok=fd?fok:ok;
yuzS=gok?yuzS+1:0;yuz=yuzS>=4;
var skv=sk/N>0.04&&sk/N<0.6;
var vis=(fd&&fok)||skv;
var cxr=(fd&&fok&&fxr>=0)?fxr:(sk>0?sx/sk/64:0.5);
var px=AYNA?1-cxr:cxr;
var stab=(dif/N<0.015)&&Math.abs(px-lastpx)<0.07;
lastpx=px;
K.vis=vis;K.px=px;K.stab=stab;
visH.push(vis);if(visH.length>6)visH.shift();
if(vis){pxH.push(px);if(pxH.length>6)pxH.shift()}
if(hedef){var oke=vis&&stab&&konum(px)==hedef;
if(oke){if(!hs)hs=Date.now();bad=0}else{bad++;if(bad>=4)hs=0}}
cs.textContent='x'+Math.round(px*100)+' c'+Math.round(sk/N*100)+(stab?' sabit':'')+(yuz?' yüz':'')}
function tut(h,need){hedef=h;hs=0;bad=0;return function(){return hs>0&&Date.now()-hs>=need}}

/* ---------- KALIBRASYON ---------- */
function kcb(f){return function(){if(cal)f()}}
function bekle(f,ms,ok,no){var t0=Date.now(),id=setInterval(function(){
if(!cal){clearInterval(id);return}
if(f()){clearInterval(id);ok()}else if(Date.now()-t0>ms){clearInterval(id);no()}},200)}
function kalBasla(){
cal={tip:'giris'};duyulan=0;tur=0;atl.style.display='block';
say('Kalibrasyon ayarlarını yapar mısınız? Önce ses testi. Sizden üç kelime söylemenizi isteyeceğim.',kcb(function(){kelimeAdim(0)}))}
function kelimeAdim(i){
if(i>=3){sesBitti();return}
cal={tip:'ses',i:i,ok:false,cnt:0};
var msg=i==0?'Birinci test: üç kere rıfkı deyin.':(i==1?'İkinci kelime: merhaba. Lütfen tekrar edin.':'Üçüncü kelime: televizyon. Lütfen tekrar edin.');
say(msg,kcb(function(){
cal.tm=setTimeout(function(){
if(cal&&cal.tip=='ses'&&cal.i==i&&!cal.ok){cal.ok=true;
say(i<2?'Duymadım, diğer kelimeye geçiyorum.':'Duymadım.',kcb(function(){kelimeAdim(i+1)}))}},i==0?15000:10000)}))}
function kelimeTamam(){
clearTimeout(cal.tm);duyulan++;var i=cal.i;
say(i==0?'Tamam, üç kere duydum.':'Tamam, duydum.',kcb(function(){kelimeAdim(i+1)}))}
function sesBitti(){
if(duyulan>=2){say('Ses testi tamam. '+duyulan+' test geçildi. Şimdi kamera testi.',kcb(kameraTest))}
else if(++tur<3){say('Yeterince kelime duyamadım. Mikrofona biraz yaklaşın, ses testini tekrar yapıyoruz.',kcb(function(){duyulan=0;kelimeAdim(0)}))}
else{cal={tip:'dur'};say('Ses testini geçemedik. Mikrofon iznini ve ses seviyesini kontrol edin, ya da sol üstteki Atla düğmesine basın.')}}
function kameraTest(){
cal={tip:'kam'};
say('Kamera testi. Kamera iznini vermenizi isteyeceğim. Yüzünüz belli olacak şekilde kameraya gelin.',kcb(function(){
kamAc(false).then(function(){
if(!cal)return;
say('Kamerayı açtım, yüzünüzü gösterin.',kcb(function(){
bekle(function(){return yuz},20000,
function(){say('Algıladım.',kcb(vucutOrta))},
function(){say('Algılayamadım, diğer teste geçiyorum.',kcb(vucutOrta))})}))
}).catch(function(){
if(!cal)return;
say('Kameraya erişemedim, kamera testlerini atlıyorum.',kcb(bitir))})}))}
function vucutOrta(){
say('Şimdi vücudunuzun bir yerini, mesela yüzünüzü ya da elinizi kameranın tam karşısına getirin ve beş saniye sabit durun.',kcb(function(){
var f=tut('orta',5000);
bekle(f,25000,
function(){hedef=null;say('Onayladım.',kcb(vucutSag))},
function(){hedef=null;say('Onaylayamadım, diğer teste geçiyorum.',kcb(vucutSag))})}))}
function vucutSag(){
say('Şimdi kameranın sağında durun, yani sağ tarafınıza geçin ve iki saniye sabit kalın.',kcb(function(){
var f=tut('sag',2000);
bekle(f,20000,
function(){hedef=null;say('Onayladım.',kcb(vucutSol))},
function(){hedef=null;say('Onaylayamadım, diğer teste geçiyorum.',kcb(vucutSol))})}))}
function vucutSol(){
say('Şimdi kameranın solunda durun, yani sol tarafınıza geçin ve iki saniye sabit kalın.',kcb(function(){
var f=tut('sol',2000);
bekle(f,20000,
function(){hedef=null;say('Onayladım.',kcb(bitir))},
function(){hedef=null;say('Onaylayamadım, devam ediyorum.',kcb(bitir))})}))}
function bitir(){kamKapat();cal=null;atl.style.display='none';say('Kalibrasyon tamamlandı. Ben hazırım!')}
atl.onclick=function(){cal=null;kamKapat();atl.style.display='none';try{speechSynthesis.cancel()}catch(e){}kon=0;say('Kalibrasyonu atladım.')};

function gor(){
var acik=!!akim;
(acik?Promise.resolve():kamAc(true)).then(function(){
say('Bakıyorum.',function(){
setTimeout(function(){
var vc=0,ps=0,pc=0,i,m,k;
for(i=0;i<visH.length;i++){if(visH[i])vc++}
for(i=0;i<pxH.length;i++){ps+=pxH[i];pc++}
if(vc>=3&&pc>0){k=konum(ps/pc);m='Evet, görüyorum. Şu anda kameranın '+(k=='orta'?'önündesin.':(k=='sol'?'solundasın.':'sağındasın.'))}
else m='Hayır, şu anda seni göremiyorum.';
if(!acik)kamKapat();
say(m)},1800)})
}).catch(function(){say('Kameraya erişemedim.')})}

/* ---------- SOHBET ---------- */
function cevap(ham){
var n=nor(ham),m;
if(mod!='n'&&/vazge[çc]|iptal/.test(n)){md('n');say('Tamam, vazgeçtim.');return}
if(mod=='o'){
if(var_(n,['evet','isterim','istiyorum','olur','tabii','ekle','tamam'])){md('c');say('Dinliyorum, cevabı söyle.')}
else if(var_(n,['hayır','hayir','yok','istemiyorum','gerek','olmaz'])){md('n');say('Tamam.')}
else say('Evet ya da hayır de.');
return}
if(mod=='s'){if(n.length<3)return;soru=n;md('c');say('Evet, şimdi bu soru sorulunca vereceğim cevabı söyle.');return}
if(mod=='c'){if(n.length<2)return;L.push({s:soru,c:ham.replace(RW,'').trim()});og();md('n');say('Tamam, öğrendim.');return}
if(/[öo]zellik ekle|soru ekle|cevap ekle|[öo][gğ]ret/.test(n)){md('s');say('Evet, soruyu söyle.');return}
if(/beni g[öo]r[üu]yor/.test(n)){gor();return}
if(/kamera/.test(n)){
if(/kapat/.test(n)){kamKapat();say('Kamerayı kapattım.')}
else{kamAc(false).then(function(){say('Kamera açık. Durumu ekranda görebilirsiniz.')}).catch(function(){say('Kameraya erişemedim.')})}
return}
if(/ad[ıi]m[ıi]? unut|beni unut/.test(n)){kisi='';ky2();say('Tamam, adını unuttum.');return}
if(/unut/.test(n)){L.pop();og();say('Tamam, son öğrendiğimi unuttum.');return}

m=n.match(/(?:ad[ıi]m|ismim) ([a-zçğıöşü]+)/)||n.match(/bana ([a-zçğıöşü]+) (?:de|diye)/);
if(m&&m[1]!='ne'&&m[1]!='nedir'&&m[1]!='ney'){kisi=cap(m[1]);ky2();say('Memnun oldum '+kisi+'.');return}
if(/ad[ıi]m ne|ad[ıi]m[ıi] bil|beni tan[ıi]/.test(n)){say(kisi?'Senin adın '+kisi+'.':'Henüz bilmiyorum. Bana adım ve adını söyle, mesela adım Ali.');return}

var h=hesap(ham);if(h){say(h);return}

var en=0,es=[];
L.forEach(function(x){var b=Math.max(benz(n,x.s),dice(n,x.s)*0.95);if(b>en+0.001){en=b;es=[x]}else if(Math.abs(b-en)<=0.001&&b>0){es.push(x)}});
if(es.length&&en>=0.75){say(sec(es).c);return}

if(/bug[üu]n.{0,12}(g[üu]n|tarih)|hangi g[üu]n|tarih ne|bug[üu]n ay[ıi]n ka[çc]/.test(n)){say('Bugün '+new Date().toLocaleDateString('tr-TR',{weekday:'long',day:'numeric',month:'long',year:'numeric'}));return}
if(/saat ka[çc]/.test(n)){say('Saat '+new Date().toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'}));return}
if(/[şs]aka|f[ıi]kra|g[üu]ld[üu]r/.test(n)){var j;do{j=Math.floor(Math.random()*SAKA.length)}while(j==sj&&SAKA.length>1);sj=j;say(SAKA[j]);return}
if(/tekrar (et|s[öo]yle)|ne dedin|bir daha s[öo]yle/.test(n)){say(son||'Henüz bir şey söylemedim.');return}
if(/g[üu]nayd[ıi]n/.test(n)){say(ad()+'Günaydın!');return}
if(/iyi geceler/.test(n)){say('İyi geceler '+(kisi?kisi+', ':'')+'tatlı rüyalar.');return}

if(/neler yapabilirsin|ne yapabilirsin|yard[ıi]m/.test(n)){say('Adını hatırlarım, hesap yaparım, tarihi ve saati söylerim, şaka anlatırım, beni görüyor musun diye sorarsan kameraya bakıp nerede olduğunu söylerim ve bana öğrettiklerini öğrenirim.');return}
